<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Etkinlik & Yarışma Takvimi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">

  <!-- Giriş Ekranı -->
  <div id="auth-screen" class="min-h-screen flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 max-w-md w-full text-center shadow-2xl">
      <div class="w-14 h-14 bg-indigo-600/20 text-indigo-400 rounded-2xl flex items-center justify-center mx-auto mb-5 text-2xl font-bold">
        📅
      </div>
      <h1 class="text-2xl font-bold mb-2">Etkinlik & Yarışma Takvimi</h1>
      <p class="text-slate-400 text-sm mb-6">
        Kayıtlarına hem telefonundan hem bilgisayarından anlık erişmek için Google hesabınla giriş yap.
      </p>
      <button id="login-btn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 cursor-pointer">
        <span>Google ile Giriş Yap</span>
      </button>
      <p id="auth-error" class="text-rose-400 text-xs mt-4 hidden"></p>
    </div>
  </div>

  <!-- Ana Uygulama Ekranı -->
  <div id="app-screen" class="hidden max-w-7xl mx-auto p-4 md:p-6">
    <!-- Üst Bar -->
    <header class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-xl md:text-2xl font-bold text-white">Etkinlik & Yarışma Takvimi</h1>
        <p id="user-email" class="text-xs text-slate-400 mt-0.5"></p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button id="open-modal-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium px-4 py-2 rounded-xl transition cursor-pointer">
          + Yeni Kayıt
        </button>
        <button id="export-btn" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-xl transition cursor-pointer">
          Dışa Aktar
        </button>
        <label class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-medium px-3 py-2 rounded-xl transition cursor-pointer">
          İçe Aktar
          <input type="file" id="import-input" accept=".json" class="hidden" />
        </label>
        <button id="logout-btn" class="bg-rose-950/60 hover:bg-rose-900/70 text-rose-300 text-xs font-medium px-3 py-2 rounded-xl transition cursor-pointer">
          Çıkış
        </button>
      </div>
    </header>

    <!-- Filtre ve Arama -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-3 my-5">
      <input id="search-input" type="text" placeholder="Etkinlik veya not ara..." class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500" />
      <select id="category-filter" class="bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500">
        <option value="all">Tüm Kategoriler</option>
        <option value="Yarışma">Yarışma</option>
        <option value="Son Başvuru">Son Başvuru</option>
        <option value="Konferans / Zirve">Konferans / Zirve</option>
        <option value="Diğer">Diğer</option>
      </select>
      <div class="flex items-center justify-between bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5">
        <button id="prev-month" class="px-3 py-1 hover:bg-slate-800 rounded-lg text-sm cursor-pointer">←</button>
        <span id="current-month-label" class="font-semibold text-sm"></span>
        <div class="flex items-center gap-1">
          <button id="today-btn" class="px-2.5 py-1 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs cursor-pointer">Bugün</button>
          <button id="next-month" class="px-3 py-1 hover:bg-slate-800 rounded-lg text-sm cursor-pointer">→</button>
        </div>
      </div>
    </div>

    <!-- İçerik Izgarası -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Aylık Takvim -->
      <div class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="grid grid-cols-7 text-center text-xs font-medium text-slate-400 pb-3 border-b border-slate-800">
          <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
        </div>
        <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 pt-3"></div>
      </div>

      <!-- Yaklaşanlar ve Geri Sayım -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col max-h-[650px]">
        <h2 class="font-semibold text-base mb-3">Yaklaşan Etkinlikler & Geri Sayım</h2>
        <div id="upcoming-list" class="space-y-3 overflow-y-auto pr-1 flex-1"></div>
      </div>
    </div>
  </div>

  <!-- Ekle / Düzenle Modalı -->
  <div id="event-modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-md w-full p-6">
      <h3 id="modal-title" class="text-lg font-bold mb-4">Yeni Kayıt Ekle</h3>
      <form id="event-form" class="space-y-3">
        <input type="hidden" id="event-id" />
        <div>
          <label class="block text-xs text-slate-400 mb-1">Başlık *</label>
          <input id="event-title" type="text" required placeholder="Örn: TÜBİTAK 2204-A Son Başvuru" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500" />
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Kategori</label>
            <select id="event-category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm">
              <option value="Yarışma">Yarışma</option>
              <option value="Son Başvuru">Son Başvuru</option>
              <option value="Konferans / Zirve">Konferans / Zirve</option>
              <option value="Diğer">Diğer</option>
            </select>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Tarih *</label>
            <input id="event-date" type="date" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Saat (İsteğe bağlı)</label>
            <input id="event-time" type="time" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Başvuru / Bilgi Linki</label>
            <input id="event-link" type="url" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm" />
          </div>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Notlar / Gereksinimler</label>
          <textarea id="event-notes" rows="3" placeholder="Ekip üyeleri, teslim şartları vb." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-indigo-500"></textarea>
        </div>
        <div class="flex justify-end gap-2 pt-3">
          <button type="button" id="close-modal-btn" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl text-sm cursor-pointer">İptal</button>
          <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-medium cursor-pointer">Kaydet</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    // =========================================================================
    // BURAYA FIREBASE CONSOLE'DAN ALDIĞIN KENDİ CONFIG BİLGİLERİNİ YAPIŞTIR:
    // =========================================================================
  // Your web app's Firebase configuration
const firebaseConfig = {
  apiKey: "AIzaSyBZlRm1Em0vMrNWNIMYVcI9mAhpaEBAjxo",
  authDomain: "sosyaltakvim.firebaseapp.com",
  databaseURL: "https://sosyaltakvim-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sosyaltakvim",
  storageBucket: "sosyaltakvim.firebasestorage.app",
  messagingSenderId: "52479859403",
  appId: "1:52479859403:web:47255613dd5969073d994e"
};

    // =========================================================================

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();

    let currentUser = null;
    let events = [];
    let unsubscribeEvents = null;
    let currentDate = new Date();

    const categoryColors = {
      "Yarışma": "bg-indigo-500/20 text-indigo-300 border-indigo-500/40",
      "Son Başvuru": "bg-rose-500/20 text-rose-300 border-rose-500/40",
      "Konferans / Zirve": "bg-emerald-500/20 text-emerald-300 border-emerald-500/40",
      "Diğer": "bg-amber-500/20 text-amber-300 border-amber-500/40"
    };

    // Giriş / Çıkış İşlemleri
    document.getElementById("login-btn").addEventListener("click", async () => {
      const errEl = document.getElementById("auth-error");
      errEl.classList.add("hidden");
      try {
        await signInWithPopup(auth, provider);
      } catch (err) {
        errEl.textContent = "Giriş hatası: " + err.message;
        errEl.classList.remove("hidden");
      }
    });

    document.getElementById("logout-btn").addEventListener("click", () => signOut(auth));

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        document.getElementById("auth-screen").classList.add("hidden");
        document.getElementById("app-screen").classList.remove("hidden");
        document.getElementById("user-email").textContent = user.email;
        listenToEvents(user.uid);
      } else {
        document.getElementById("auth-screen").classList.remove("hidden");
        document.getElementById("app-screen").classList.add("hidden");
        if (unsubscribeEvents) unsubscribeEvents();
        events = [];
      }
    });

    // Firestore Canlı Dinleme
    function listenToEvents(uid) {
      const eventsRef = collection(db, "users", uid, "events");
      unsubscribeEvents = onSnapshot(eventsRef, (snapshot) => {
        events = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
        renderAll();
      });
    }

    function getFilteredEvents() {
      const q = document.getElementById("search-input").value.toLowerCase();
      const cat = document.getElementById("category-filter").value;
      return events.filter(ev => {
        const matchCat = cat === "all" || ev.category === cat;
        const matchText = ev.title.toLowerCase().includes(q) || (ev.notes || "").toLowerCase().includes(q);
        return matchCat && matchText;
      });
    }

    function renderAll() {
      renderCalendar();
      renderUpcoming();
    }

    function renderCalendar() {
      const grid = document.getElementById("calendar-grid");
      grid.innerHTML = "";
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
      document.getElementById("current-month-label").textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1).getDay();
      const startOffset = firstDay === 0 ? 6 : firstDay - 1;
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const todayStr = new Date().toISOString().split("T")[0];
      const filtered = getFilteredEvents();

      for (let i = 0; i < startOffset; i++) {
        grid.innerHTML += `<div class="min-h-[85px] bg-slate-950/40 rounded-xl"></div>`;
      }

      for (let day = 1; day <= daysInMonth; day++) {
        const dateStr = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const dayEvents = filtered.filter(e => e.date === dateStr);
        const isToday = dateStr === todayStr;

        const cell = document.createElement("div");
        cell.className = `min-h-[85px] p-1.5 rounded-xl border transition cursor-pointer flex flex-col gap-1 ${
          isToday ? "bg-indigo-950/30 border-indigo-500" : "bg-slate-950/70 border-slate-800/80 hover:border-slate-700"
        }`;
        cell.onclick = () => openModal(null, dateStr);

        cell.innerHTML = `<div class="text-xs font-semibold ${isToday ? "text-indigo-400" : "text-slate-400"}">${day}</div>`;
        dayEvents.forEach(ev => {
          const badge = document.createElement("div");
          badge.className = `text-[11px] px-1.5 py-0.5 rounded border truncate ${categoryColors[ev.category] || categoryColors["Diğer"]}`;
          badge.textContent = ev.title;
          badge.onclick = (e) => { e.stopPropagation(); openModal(ev); };
          cell.appendChild(badge);
        });

        grid.appendChild(cell);
      }
    }

    function renderUpcoming() {
      const list = document.getElementById("upcoming-list");
      list.innerHTML = "";
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      const sorted = [...getFilteredEvents()].sort((a, b) => a.date.localeCompare(b.date));
      if (sorted.length === 0) {
        list.innerHTML = `<p class="text-xs text-slate-500 text-center py-8">Kayıtlı etkinlik bulunamadı.</p>`;
        return;
      }

      sorted.forEach(ev => {
        const evDate = new Date(ev.date + "T00:00:00");
        const diffDays = Math.round((evDate - today) / (1000 * 60 * 60 * 24));
        let badgeText = diffDays === 0 ? "Bugün!" : diffDays === 1 ? "Yarın" : diffDays > 1 ? `${diffDays} gün kaldı` : "Süresi doldu";
        let badgeStyle = diffDays < 0 ? "bg-slate-800 text-slate-400" : diffDays <= 3 ? "bg-rose-500/20 text-rose-300" : "bg-indigo-500/20 text-indigo-300";

        const card = document.createElement("div");
        card.className = "bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2";
        card.innerHTML = `
          <div class="flex items-start justify-between gap-2">
            <div>
              <span class="text-[10px] px-2 py-0.5 rounded border ${categoryColors[ev.category] || categoryColors["Diğer"]}">${ev.category}</span>
              <h4 class="font-semibold text-sm mt-1.5">${ev.title}</h4>
            </div>
            <span class="text-[11px] font-medium px-2 py-0.5 rounded-lg shrink-0 ${badgeStyle}">${badgeText}</span>
          </div>
          <div class="text-xs text-slate-400">${ev.date} ${ev.time ? "• " + ev.time : ""}</div>
          ${ev.notes ? `<p class="text-xs text-slate-300 bg-slate-900/80 p-2 rounded-lg">${ev.notes}</p>` : ""}
          <div class="flex items-center justify-between pt-1">
            ${ev.link ? `<a href="${ev.link}" target="_blank" class="text-xs text-indigo-400 hover:underline">Bağlantıya Git ↗</a>` : `<span></span>`}
            <div class="flex gap-2">
              <button class="edit-btn text-xs text-slate-400 hover:text-white cursor-pointer">Düzenle</button>
              <button class="del-btn text-xs text-rose-400 hover:text-rose-300 cursor-pointer">Sil</button>
            </div>
          </div>
        `;
        card.querySelector(".edit-btn").onclick = () => openModal(ev);
        card.querySelector(".del-btn").onclick = async () => {
          if (confirm("Bu kaydı silmek istediğine emin misin?")) {
            await deleteDoc(doc(db, "users", currentUser.uid, "events", ev.id));
          }
        };
        list.appendChild(card);
      });
    }

    // Modal Yönetimi
    const modal = document.getElementById("event-modal");
    function openModal(ev = null, defaultDate = "") {
      document.getElementById("modal-title").textContent = ev ? "Kaydı Düzenle" : "Yeni Kayıt Ekle";
      document.getElementById("event-id").value = ev ? ev.id : "";
      document.getElementById("event-title").value = ev ? ev.title : "";
      document.getElementById("event-category").value = ev ? ev.category : "Yarışma";
      document.getElementById("event-date").value = ev ? ev.date : (defaultDate || new Date().toISOString().split("T")[0]);
      document.getElementById("event-time").value = ev ? (ev.time || "") : "";
      document.getElementById("event-link").value = ev ? (ev.link || "") : "";
      document.getElementById("event-notes").value = ev ? (ev.notes || "") : "";
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    document.getElementById("open-modal-btn").onclick = () => openModal();
    document.getElementById("close-modal-btn").onclick = () => { modal.classList.add("hidden"); modal.classList.remove("flex"); };

    document.getElementById("event-form").onsubmit = async (e) => {
      e.preventDefault();
      const id = document.getElementById("event-id").value;
      const payload = {
        title: document.getElementById("event-title").value.trim(),
        category: document.getElementById("event-category").value,
        date: document.getElementById("event-date").value,
        time: document.getElementById("event-time").value,
        link: document.getElementById("event-link").value.trim(),
        notes: document.getElementById("event-notes").value.trim()
      };

      if (id) {
        await updateDoc(doc(db, "users", currentUser.uid, "events", id), payload);
      } else {
        await addDoc(collection(db, "users", currentUser.uid, "events"), payload);
      }
      modal.classList.add("hidden");
      modal.classList.remove("flex");
    };

    // Navigasyon ve Filtreler
    document.getElementById("prev-month").onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
    document.getElementById("next-month").onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };
    document.getElementById("today-btn").onclick = () => { currentDate = new Date(); renderCalendar(); };
    document.getElementById("search-input").oninput = renderAll;
    document.getElementById("category-filter").onchange = renderAll;

    // JSON Dışa / İçe Aktar
    document.getElementById("export-btn").onclick = () => {
      const blob = new Blob([JSON.stringify(events, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "takvim-yedek.json";
      a.click();
    };

    document.getElementById("import-input").onchange = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const text = await file.text();
      const imported = JSON.parse(text);
      for (const item of imported) {
        const { id, ...data } = item;
        await addDoc(collection(db, "users", currentUser.uid, "events"), data);
      }
      e.target.value = "";
    };
  </script>
</body>
</html>
